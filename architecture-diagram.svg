<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:18px}.n{fill:#fff;stroke:#40516b;stroke-width:2;rx:14}.edge{stroke:#607089;stroke-width:3;marker-end:url(#a)}.cloud{fill:#fff0f3;stroke:#e81b5b;stroke-width:2;rx:14}.data{fill:#eef5ff;stroke:#2368be;stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#607089"/></marker></defs>
  <rect width="1600" height="1020" fill="#f8fafc"/><text x="800" y="58" text-anchor="middle" class="t">Production-scale vacation-rental marketplace</text><text x="800" y="88" text-anchor="middle" class="s">Independent services scale horizontally; cache, search and events remove pressure from transactional systems.</text>
  <g><rect class="n" x="650" y="125" width="300" height="74"/><text x="800" y="170" text-anchor="middle" class="t">Web &amp; mobile clients</text><rect class="cloud" x="650" y="250" width="300" height="74"/><text x="800" y="295" text-anchor="middle" class="t">CDN + WAF</text><rect class="cloud" x="650" y="375" width="300" height="74"/><text x="800" y="420" text-anchor="middle" class="t">API gateway / BFF</text><line class="edge" x1="800" y1="199" x2="800" y2="250"/><line class="edge" x1="800" y1="324" x2="800" y2="375"/></g>
  <g><rect class="n" x="85" y="515" width="210" height="72"/><text x="190" y="559" text-anchor="middle" class="t">Identity</text><rect class="n" x="355" y="515" width="210" height="72"/><text x="460" y="559" text-anchor="middle" class="t">Listings</text><rect class="n" x="625" y="515" width="210" height="72"/><text x="730" y="559" text-anchor="middle" class="t">Bookings</text><rect class="n" x="895" y="515" width="210" height="72"/><text x="1000" y="559" text-anchor="middle" class="t">Payments</text><rect class="n" x="1165" y="515" width="210" height="72"/><text x="1270" y="559" text-anchor="middle" class="t">Reviews</text><line class="edge" x1="800" y1="449" x2="190" y2="515"/><line class="edge" x1="800" y1="449" x2="460" y2="515"/><line class="edge" x1="800" y1="449" x2="730" y2="515"/><line class="edge" x1="800" y1="449" x2="1000" y2="515"/><line class="edge" x1="800" y1="449" x2="1270" y2="515"/></g>
  <g><rect class="data" x="245" y="715" width="250" height="78"/><text x="370" y="750" text-anchor="middle" class="t">Postgres</text><text x="370" y="775" text-anchor="middle" class="s">primary + read replicas</text><rect class="data" x="570" y="715" width="220" height="78"/><text x="680" y="750" text-anchor="middle" class="t">Redis</text><text x="680" y="775" text-anchor="middle" class="s">session &amp; listing cache</text><rect class="data" x="865" y="715" width="220" height="78"/><text x="975" y="750" text-anchor="middle" class="t">OpenSearch</text><text x="975" y="775" text-anchor="middle" class="s">geo / availability search</text><rect class="data" x="1160" y="715" width="220" height="78"/><text x="1270" y="750" text-anchor="middle" class="t">Object storage</text><text x="1270" y="775" text-anchor="middle" class="s">photos → image CDN</text></g>
  <g><rect class="cloud" x="505" y="880" width="230" height="70"/><text x="620" y="923" text-anchor="middle" class="t">Event bus</text><rect class="n" x="865" y="880" width="230" height="70"/><text x="980" y="923" text-anchor="middle" class="t">Workers / analytics</text><line class="edge" x1="730" y1="587" x2="620" y2="880"/><line class="edge" x1="1000" y1="587" x2="620" y2="880"/><line class="edge" x1="735" y1="915" x2="865" y2="915"/></g>
  <line class="edge" x1="460" y1="587" x2="370" y2="715"/><line class="edge" x1="730" y1="587" x2="370" y2="715"/><line class="edge" x1="1270" y1="587" x2="370" y2="715"/><line class="edge" x1="460" y1="587" x2="680" y2="715"/><line class="edge" x1="460" y1="587" x2="975" y2="715"/><line class="edge" x1="460" y1="587" x2="1270" y2="715"/>
</svg>
